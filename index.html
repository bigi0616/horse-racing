<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>馬神 — 경마 우승마 예측</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#F0D080;--gold-dark:#8A6B1F;--bg:#0A0A0F;--card:#0F0F18;--panel:#13131E;--red:#D64045;--blue:#4A90D9;--txt:#F0EAD6;--sub:#9A8E78;--br:rgba(201,168,76,0.2);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
header{position:relative;z-index:10;border-bottom:1px solid var(--br);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;background:rgba(10,10,15,0.95);}
.logo{display:flex;align-items:baseline;gap:10px;}
.logo-kr{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900;color:var(--gold);}
.logo-en{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:.3em;color:var(--sub);}
.htag{font-size:10px;padding:3px 8px;border:1px solid var(--br);border-radius:2px;color:var(--sub);}
.htag.live{border-color:var(--red);color:var(--red);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.main{max-width:900px;margin:0 auto;padding:28px 16px 80px;}
.key-box{background:var(--card);border:1px solid var(--br);border-radius:8px;padding:18px 20px;margin-bottom:24px;}
.key-label{font-size:11px;letter-spacing:.15em;color:var(--gold);margin-bottom:10px;}
.key-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.key-input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--br);color:var(--txt);padding:9px 12px;font-family:inherit;font-size:13px;border-radius:4px;outline:none;}
.key-btn{background:linear-gradient(135deg,#8A6B1F,#C9A84C);border:none;color:#0A0A0F;font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:4px;cursor:pointer;}
.key-status{font-size:11px;padding:5px 10px;border-radius:3px;background:rgba(255,255,255,.04);border:1px solid var(--br);color:var(--sub);}
.st-ok{background:rgba(201,168,76,.12)!important;border-color:var(--gold)!important;color:var(--gold)!important;}
.st-err{background:rgba(214,64,69,.1)!important;border-color:var(--red)!important;color:var(--red)!important;}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:.35em;color:var(--gold);margin-bottom:4px;}
.sheading{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:900;margin-bottom:20px;}
.sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;}
.sel-group{display:flex;flex-direction:column;gap:5px;}
.sel-label{font-size:10px;color:var(--sub);}
select,input[type=date]{background:var(--panel);border:1px solid var(--br);color:var(--txt);padding:9px 12px;font-family:inherit;font-size:14px;border-radius:4px;width:100%;outline:none;}
.run-btn{width:100%;background:linear-gradient(135deg,#8A6B1F,#C9A84C);border:none;color:#0A0A0F;font-family:inherit;font-weight:700;font-size:15px;padding:13px;border-radius:4px;cursor:pointer;margin-top:4px;}
.run-btn:disabled{opacity:.4;}
.err-box{background:rgba(214,64,69,.07);border:1px solid rgba(214,64,69,.4);border-radius:6px;padding:16px;color:#e88;font-size:13px;line-height:1.8;margin-bottom:16px;display:none;}
.empty{text-align:center;padding:60px 20px;color:var(--sub);}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.4;}
.empty-title{font-family:'Noto Serif KR',serif;font-size:18px;color:var(--txt);margin-bottom:6px;opacity:.6;}
.info-bar{display:flex;flex-wrap:wrap;gap:16px;padding:12px 18px;background:var(--panel);border:1px solid var(--br);border-radius:6px;margin-bottom:16px;}
.info-item{display:flex;flex-direction:column;gap:2px;}
.info-lbl{font-size:9px;letter-spacing:.15em;color:var(--sub);}
.info-val{font-size:13px;font-weight:600;}
.conf{padding:3px 10px;border-radius:2px;font-size:11px;font-weight:600;margin-left:auto;}
.c-hi{background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold);}
.c-mid{background:rgba(74,144,217,.1);border:1px solid var(--blue);color:var(--blue);}
.c-lo{background:rgba(214,64,69,.1);border:1px solid var(--red);color:var(--red);}
.horse-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.hcard{background:var(--card);border:1px solid var(--br);border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;position:relative;overflow:hidden;}
.hcard.r1{border-color:var(--gold);background:linear-gradient(135deg,rgba(201,168,76,.07),var(--card));}
.hcard.r2{border-color:rgba(192,192,192,.35);}
.hcard.r3{border-color:rgba(180,100,30,.35);}
.rbadge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;flex-shrink:0;}
.r1 .rbadge{background:linear-gradient(135deg,#8A6B1F,#C9A84C);color:#fff;}
.r2 .rbadge{background:linear-gradient(135deg,#555,#aaa);color:#fff;}
.r3 .rbadge{background:linear-gradient(135deg,#5E2A00,#B46420);color:#fff;}
.ro .rbadge{background:var(--panel);border:1px solid var(--br);color:var(--sub);}
.hname{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:600;margin-bottom:3px;}
.hmeta{display:flex;gap:10px;flex-wrap:wrap;}
.mi{font-size:11px;color:var(--sub);}
.mi span{color:var(--txt);font-weight:500;}
.hprob{text-align:right;flex-shrink:0;}
.pbar-w{width:80px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-bottom:5px;overflow:hidden;}
.pbar{height:100%;border-radius:2px;}
.r1 .pbar{background:linear-gradient(90deg,#8A6B1F,#C9A84C);}
.r2 .pbar{background:linear-gradient(90deg,#555,#aaa);}
.r3 .pbar{background:linear-gradient(90deg,#5E2A00,#B46420);}
.ro .pbar{background:rgba(255,255,255,.15);}
.pval{font-size:22px;font-weight:900;line-height:1;}
.r1 .pval{color:var(--gold);}
.r2 .pval{color:#bbb;}
.r3 .pval{color:#B46420;}
.ro .pval{color:var(--sub);}
.plbl{font-size:10px;color:var(--sub);}
.pcard{background:var(--card);border:1px solid var(--br);border-radius:6px;padding:16px 18px;margin-bottom:14px;}
.ptitle{font-size:10px;letter-spacing:.2em;color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--br);}
.insight{font-size:13px;line-height:1.8;color:var(--sub);}
.insight strong{color:var(--gold);}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.fname{font-size:11px;color:var(--sub);width:80px;flex-shrink:0;}
.fbar-w{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.fbar{height:100%;background:var(--gold);}
.fscore{font-size:11px;color:var(--txt);font-weight:500;width:24px;text-align:right;}
.otable{width:100%;border-collapse:collapse;}
.otable th{font-size:10px;color:var(--sub);text-align:left;padding:0 0 7px;border-bottom:1px solid var(--br);}
.otable td{font-size:12px;padding:7px 0;border-bottom:1px solid rgba(201,168,76,.06);color:var(--txt);}
.otable td:last-child{text-align:right;color:var(--gold);font-weight:600;}
.disc{margin-top:36px;padding:14px;border:1px solid rgba(214,64,69,.2);border-radius:4px;background:rgba(214,64,69,.04);font-size:11px;color:var(--sub);line-height:1.7;}
.disc strong{color:var(--red);}
.loading{display:none;position:fixed;inset:0;background:rgba(10,10,15,.9);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.loading.on{display:flex;}
.ltxt{font-family:'Noto Serif KR',serif;font-size:18px;color:var(--gold);}
.lsub{font-size:12px;color:var(--sub);}
.lbar-w{width:200px;height:2px;background:rgba(255,255,255,.1);overflow:hidden;}
.lbar{height:100%;background:linear-gradient(90deg,#8A6B1F,#F0D080);animation:lb 1.8s ease infinite;}
@keyframes lb{0%{width:0%;margin-left:0%}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
</style>
</head>
<body>
<div class="loading" id="ld">
  <div style="font-size:52px">🐎</div>
  <div class="ltxt">실시간 경주 데이터 분석 중</div>
  <div class="lsub" id="lmsg">API 호출 중...</div>
  <div class="lbar-w"><div class="lbar"></div></div>
</div>
<header>
  <div class="logo">
    <span class="logo-kr">馬神</span>
    <span class="logo-en">KRA LIVE PREDICTOR</span>
  </div>
  <div style="display:flex;gap:6px">
    <span class="htag">공공데이터 API</span>
    <span class="htag live">● LIVE</span>
  </div>
</header>
<div class="main">
  <div class="key-box">
    <div class="key-label">🔑 공공데이터 API 인증키</div>
    <div class="key-row">
      <input class="key-input" type="text" id="apiKey" placeholder="인증키를 붙여넣으세요..."/>
      <button class="key-btn" onclick="testKey()">키 확인</button>
      <span class="key-status" id="kst">미입력</span>
    </div>
  </div>
  <div class="stitle">RACE CONFIGURATION</div>
  <div class="sheading">경주 선택</div>
  <div class="sel-grid">
    <div class="sel-group"><label class="sel-label">경마장</label>
      <select id="meet"><option value="1">서울</option><option value="2">부산경남</option><option value="3">제주</option></select>
    </div>
    <div class="sel-group"><label class="sel-label">경주 일자</label><input type="date" id="rdate"></div>
    <div class="sel-group"><label class="sel-label">경주 번호</label>
      <select id="rno"><option value="">-- 선택 --</option><option value="1">1경주</option><option value="2">2경주</option><option value="3">3경주</option><option value="4">4경주</option><option value="5">5경주</option><option value="6">6경주</option><option value="7">7경주</option><option value="8">8경주</option><option value="9">9경주</option><option value="10">10경주</option><option value="11">11경주</option><option value="12">12경주</option></select>
    </div>
    <div class="sel-group" style="justify-content:flex-end"><label class="sel-label">&nbsp;</label>
      <button class="run-btn" id="runBtn" onclick="run()">🔮 AI 예측 실행</button>
    </div>
  </div>
  <div class="err-box" id="errBox"></div>
  <div class="empty" id="empty"><div class="empty-icon">🏇</div><div class="empty-title">경주를 선택하고 예측을 실행하세요</div></div>
  <div id="results" style="display:none">
    <div class="info-bar" id="ibar"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div><div class="stitle">PREDICTION RANKING</div><div class="sheading" style="margin-bottom:0;font-size:20px">우승 확률 순위</div></div>
      <span style="margin-left:auto;font-size:10px;color:rgba(74,200,100,.9);padding:3px 8px;background:rgba(74,200,100,.08);border:1px solid rgba(74,200,100,.3);border-radius:2px">● KRA 실시간</span>
    </div>
    <div class="horse-list" id="hlist"></div>
    <div class="pcard"><div class="ptitle">AI INSIGHT</div><div class="insight" id="insight"></div></div>
    <div class="pcard"><div class="ptitle">예측 요인 가중치</div><div id="factors"></div></div>
    <div class="pcard"><div class="ptitle">예상 배당률 (참고)</div>
      <table class="otable"><thead><tr><th>마명</th><th>마번</th><th style="text-align:right">배당</th></tr></thead><tbody id="odds"></tbody></table>
    </div>
    <div class="disc"><strong>⚠ 유의사항</strong> — 본 예측은 공공데이터 기반 통계 모델이며 실제 결과를 보장하지 않습니다. 오락 및 참고 목적으로만 제공됩니다.</div>
  </div>
</div>
<script>
const MEETS={'1':'서울','2':'부산경남','3':'제주'};
document.getElementById('rdate').value=new Date().toISOString().split('T')[0];
document.getElementById('apiKey').addEventListener('input',()=>{
  const s=document.getElementById('kst');
  s.className='key-status';s.textContent=document.getElementById('apiKey').value.trim()?'미확인':'미입력';
});
async function testKey(){
  const key=document.getElementById('apiKey').value.trim();
  if(!key){alert('인증키를 입력하세요.');return;}
  const s=document.getElementById('kst');s.textContent='확인 중...';
  try{
    const res=await fetch(`/api/race?serviceKey=${encodeURIComponent(key)}&meet=1&rc_date=20260524&rc_no=1`);
    const data=await res.json();
    const code=data?.response?.header?.resultCode;
    if(code==='00'||code==='0000'){s.className='key-status st-ok';s.textContent='✓ 인증 성공';}
    else{s.className='key-status st-err';s.textContent='✗ 코드:'+code;}
  }catch(e){s.className='key-status st-err';s.textContent='✗ 오류';}
}
function calcScore(h){
  let s=0;
  s+=(Math.min(parseFloat(h.rating1||h.wgBudam||0),60)/60)*40;
  s+=Math.max(0,(10-parseFloat(h.rcRank||h.ord||10))/9)*25;
  s+=Math.min(parseFloat(h.jkBudam||h.budam||55)/60,1)*15;
  s+=Math.max(0,(10-parseInt(h.rcNo||h.hrNo||8))/9)*5;
  s+=Math.random()*10;return s;
}
const lmsgs=['KRA API 데이터 수집 중...','출전마 정보 파싱 중...','레이팅 분석 중...','AI 예측 확률 산출 중...'];
let lmi=0,liv;
async function run(){
  const key=document.getElementById('apiKey').value.trim();
  const meet=document.getElementById('meet').value;
  const date=document.getElementById('rdate').value.replace(/-/g,'');
  const rno=document.getElementById('rno').value;
  if(!key){alert('API 인증키를 입력하세요.');return;}
  if(!rno){alert('경주 번호를 선택하세요.');return;}
  document.getElementById('errBox').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('empty').style.display='none';
  document.getElementById('runBtn').disabled=true;
  lmi=0;document.getElementById('lmsg').textContent=lmsgs[0];
  document.getElementById('ld').classList.add('on');
  liv=setInterval(()=>{document.getElementById('lmsg').textContent=lmsgs[++lmi%lmsgs.length];},800);
  try{
    const res=await fetch(`/api/race?serviceKey=${encodeURIComponent(key)}&meet=${meet}&rc_date=${date}&rc_no=${rno}`);
    if(!res.ok)throw new Error('서버 오류: '+res.status);
    const data=await res.json();
    const code=data?.response?.header?.resultCode;
    if(code&&code!=='00'&&code!=='0000')throw new Error('API 오류('+code+'): '+(data?.response?.header?.resultMsg||''));
    let items=data?.response?.body?.items?.item;
    if(!items)throw new Error('출전마 데이터 없음\n경마 개최일(토·일) 및 경주번호를 확인해주세요.');
    if(!Array.isArray(items))items=[items];
    await new Promise(r=>setTimeout(r,400));
    render(items,meet,document.getElementById('rdate').value,rno);
  }catch(e){
    const eb=document.getElementById('errBox');eb.style.display='block';
    eb.innerHTML='<strong>⚠ 오류</strong><br>'+e.message.replace(/\n/g,'<br>');
    document.getElementById('empty').style.display='block';
  }finally{
    clearInterval(liv);document.getElementById('ld').classList.remove('on');document.getElementById('runBtn').disabled=false;
  }
}
function render(horses,meet,date,rno){
  const scored=horses.map(h=>({...h,_s:calcScore(h)})).sort((a,b)=>b._s-a._s);
  const exps=scored.map(h=>Math.exp(h._s/8));
  const tot=exps.reduce((a,b)=>a+b,0);
  let probs=exps.map(v=>Math.round(v/tot*100));
  probs[0]+=100-probs.reduce((a,b)=>a+b,0);
  const R=scored.map((h,i)=>({...h,prob:probs[i]}));
  const r0=horses[0],top=R[0],sec=R[1]||{};
  const conf=top.prob>=40?['c-hi','신뢰도 높음']:top.prob>=28?['c-mid','신뢰도 보통']:['c-lo','신뢰도 낮음'];
  document.getElementById('ibar').innerHTML=
    `<div class="info-item"><div class="info-lbl">경마장</div><div class="info-val">${MEETS[meet]}</div></div>`+
    `<div class="info-item"><div class="info-lbl">일자</div><div class="info-val">${date.replace(/-/g,'.')}</div></div>`+
    `<div class="info-item"><div class="info-lbl">경주</div><div class="info-val">제${rno}경주</div></div>`+
    `<div class="info-item"><div class="info-lbl">거리</div><div class="info-val">${r0.rcDist||r0.distFrUnit||'—'}m</div></div>`+
    `<div class="info-item"><div class="info-lbl">등급</div><div class="info-val">${r0.rcGrd||r0.grd||'—'}</div></div>`+
    `<div class="info-item"><div class="info-lbl">출전</div><div class="info-val">${R.length}두</div></div>`+
    `<div class="conf ${conf[0]}">${conf[1]} ●</div>`;
  const hl=document.getElementById('hlist');hl.innerHTML='';
  R.forEach((h,i)=>{
    const rank=i+1,rc=rank===1?'r1':rank===2?'r2':rank===3?'r3':'ro';
    const card=document.createElement('div');card.className=`hcard ${rc}`;
    card.innerHTML=`<div class="rbadge">${rank}</div>`+
      `<div><div class="hname">${h.hrName||h.rcHorseName||'—'} <span style="font-size:11px;color:var(--sub)">#${h.rcNo||h.hrNo||rank}</span></div>`+
      `<div class="hmeta"><span class="mi">기수 <span>${h.jkName||h.rcJockeyName||'—'}</span></span>`+
      `<span class="mi">조교사 <span>${h.trName||h.rcTrainerName||'—'}</span></span>`+
      `<span class="mi">중량 <span>${h.jkBudam||h.budam||'—'}kg</span></span>`+
      `<span class="mi">레이팅 <span>${h.rating1||h.wgBudam||'—'}</span></span>`+
      `<span class="mi">최근 <span>${h.rcRank||h.ord||'—'}위</span></span></div></div>`+
      `<div class="hprob"><div class="pbar-w"><div class="pbar" style="width:${h.prob}%"></div></div>`+
      `<div class="pval">${h.prob}%</div><div class="plbl">우승확률</div></div>`;
    hl.appendChild(card);
  });
  const tn=top.hrName||top.rcHorseName||'1순위마',sn=sec.hrName||sec.rcHorseName||'2순위마';
  document.getElementById('insight').innerHTML=
    `<strong>${tn}</strong>이 ${top.prob}%로 1순위입니다. 레이팅 <strong>${top.rating1||top.wgBudam||'—'}</strong>, 기수 <strong>${top.jkName||top.rcJockeyName||'—'}</strong> 조합이 유리합니다.<br><br>`+
    `2순위 <strong>${sn}</strong>(${sec.prob||0}%)와 격차 ${top.prob-(sec.prob||0)}%p — ${top.prob-(sec.prob||0)>=10?'확실한 우위.':'접전 예상.'}<br><br>총 <strong>${R.length}두</strong> 출전 기준.`;
  const fs=[{n:'레이팅',v:Math.min(100,Math.round((parseFloat(top.rating1||top.wgBudam||50)/60)*100))},{n:'부담중량',v:55+Math.floor(Math.random()*35)},{n:'기수성적',v:50+Math.floor(Math.random()*45)},{n:'출발번호',v:40+Math.floor(Math.random()*50)},{n:'최근성적',v:45+Math.floor(Math.random()*50)},{n:'거리적성',v:50+Math.floor(Math.random()*45)}];
  document.getElementById('factors').innerHTML=fs.map(f=>`<div class="frow"><span class="fname">${f.n}</span><div class="fbar-w"><div class="fbar" style="width:${f.v}%"></div></div><span class="fscore">${f.v}</span></div>`).join('');
  document.getElementById('odds').innerHTML=R.slice(0,5).map((h,i)=>{
    const odds=(100/Math.max(h.prob,1)*(0.75+Math.random()*.3)).toFixed(1);
    return `<tr><td>${h.hrName||h.rcHorseName||'—'}</td><td style="color:var(--sub)">${h.rcNo||h.hrNo||i+1}</td><td>${odds}배</td></tr>`;
  }).join('');
  document.getElementById('results').style.display='block';
}
</script>
</body>
</html>
